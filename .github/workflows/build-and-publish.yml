name: Build and Publish

on:
  release:
    types:
      - published
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Gradle version override, for example 1.2.4-SNAPSHOT"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore i18n source cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci/Bondage-College
            docs/echo-activity-ext
            docs/echo-clothing-ext
          key: i18n-sources-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            i18n-sources-${{ runner.os }}-

      - name: Prepare i18n sources
        run: |
          mkdir -p .ci docs

          prepare_repo() {
            local repo="$1"
            local dir="$2"

            if [[ -d "$dir/.git" ]]; then
              git -C "$dir" remote set-url origin "$repo"
              git -C "$dir" reset --hard
              git -C "$dir" clean -fdx
              git -C "$dir" pull --ff-only || {
                rm -rf "$dir"
                git clone --depth 1 "$repo" "$dir"
              }
            else
              rm -rf "$dir"
              git clone --depth 1 "$repo" "$dir"
            fi
          }

          prepare_repo https://gitgud.io/BondageProjects/Bondage-College.git .ci/Bondage-College
          rm -rf docs/BondageClub
          ln -s "$PWD/.ci/Bondage-College/BondageClub" docs/BondageClub
          prepare_repo https://github.com/SugarChain-Studio/echo-activity-ext.git docs/echo-activity-ext
          prepare_repo https://github.com/SugarChain-Studio/echo-clothing-ext.git docs/echo-clothing-ext

      - name: Save i18n source cache
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/Bondage-College
            docs/echo-activity-ext
            docs/echo-clothing-ext
          key: i18n-sources-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          version="$REQUESTED_VERSION"

          if [[ -z "$version" && -n "$RELEASE_TAG" ]]; then
            version="$RELEASE_TAG"
          fi

          if [[ -z "$version" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$version" ]]; then
            latest_version="$(git tag --list --sort=-v:refname | sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+)$/\1.\2.\3/p' | head -n 1)"
            if [[ -n "$latest_version" ]]; then
              IFS=. read -r major minor patch <<< "$latest_version"
              version="${major}.${minor}.$((patch + 1))-SNAPSHOT"
            else
              version="1.0-SNAPSHOT"
            fi
          fi

          version="${version#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Using Gradle version $version"

      - name: Build tui and telegram jars
        run: ./gradlew :application:tui:bootJar :application:telegram:bootJar

      - name: Upload tui jar
        uses: actions/upload-artifact@v4
        with:
          name: razor-client-tui
          path: |
            application/tui/build/libs/*.jar
            !application/tui/build/libs/*-plain.jar
          if-no-files-found: error

      - name: Upload telegram jar
        uses: actions/upload-artifact@v4
        with:
          name: razor-client-telegram
          path: |
            application/telegram/build/libs/*.jar
            !application/telegram/build/libs/*-plain.jar
          if-no-files-found: error

      - name: Publish non-application modules
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
