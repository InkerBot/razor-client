name: Build and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build application jars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build tui and telegram jars
        run: ./gradlew :application:tui:bootJar :application:telegram:bootJar

      - name: Upload tui jar
        uses: actions/upload-artifact@v4
        with:
          name: razor-client-tui
          path: |
            application/tui/build/libs/*.jar
            !application/tui/build/libs/*-plain.jar
          if-no-files-found: error

      - name: Upload telegram jar
        uses: actions/upload-artifact@v4
        with:
          name: razor-client-telegram
          path: |
            application/telegram/build/libs/*.jar
            !application/telegram/build/libs/*-plain.jar
          if-no-files-found: error

  publish:
    name: Publish libraries to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish non-application modules
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
